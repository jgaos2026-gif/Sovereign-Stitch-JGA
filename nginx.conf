# nginx.conf — jgaos2026-gif.com reverse proxy
# SSL certificates are managed by Certbot (Let's Encrypt).
# Run:  certbot --nginx -d jgaos2026-gif.com -d www.jgaos2026-gif.com
# Certbot will update this file in-place with the SSL block.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- HTTP: redirect everything to HTTPS www ---
    server {
        listen 80;
        server_name jgaos2026-gif.com www.jgaos2026-gif.com;

        # Certbot ACME challenge (leave this path unredirected)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://www.jgaos2026-gif.com$request_uri;
        }
    }

    # --- HTTPS bare domain: redirect to www ---
    server {
        listen 443 ssl;
        server_name jgaos2026-gif.com;

        ssl_certificate     /etc/letsencrypt/live/jgaos2026-gif.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jgaos2026-gif.com/privkey.pem;

        return 301 https://www.jgaos2026-gif.com$request_uri;
    }

    # --- HTTPS www: main application ---
    server {
        listen 443 ssl;
        server_name www.jgaos2026-gif.com;

        ssl_certificate     /etc/letsencrypt/live/jgaos2026-gif.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jgaos2026-gif.com/privkey.pem;

        # Modern SSL settings
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers (mirrors the old vercel.json headers config)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        # CORS for API routes.
        # Note: the bare domain (jgaos2026-gif.com) is permanently redirected to www
        # at the server block above, so API clients must use https://www.jgaos2026-gif.com.
        location /api/ {
            # CORS headers must appear on every response including OPTIONS preflight
            add_header Access-Control-Allow-Origin  "https://www.jgaos2026-gif.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            # Return preflight immediately (CORS headers already added above)
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # /home → / permanent redirect (from old vercel.json)
        location = /home {
            return 301 /;
        }

        # All other routes
        location / {
            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
