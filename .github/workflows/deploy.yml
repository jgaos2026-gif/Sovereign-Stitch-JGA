name: Deploy to Production

# Triggers:
#   - Manual via GitHub Actions UI (workflow_dispatch)
#   - Automatic on push to main/master
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   DEPLOY_HOST       – your server IP or hostname (e.g. 1.2.3.4)
#   DEPLOY_USER       – SSH user on the server (e.g. ubuntu or deploy)
#   DEPLOY_SSH_KEY    – private SSH key whose public key is in ~/.ssh/authorized_keys on server
#
# Required env vars on the server in /opt/jga-os/.env:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
#   JWT_SECRET, POSTGRES_PASSWORD, REDIS_PASSWORD

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd /opt/jga-os
            # Safely update APP_IMAGE in .env — create .env if it doesn't exist yet
            touch .env
            grep -v '^APP_IMAGE=' .env > .env.tmp
            echo 'APP_IMAGE=$IMAGE' >> .env.tmp
            mv .env.tmp .env
            docker compose pull app
            # Only restart the app container; nginx config is static on the host
            docker compose up -d --no-build app
            docker image prune -f
            echo '✅ Deployed $IMAGE'
          "

      - name: Notify success
        if: success()
        run: echo "✅ Production deployment successful — ${{ github.sha }}"
